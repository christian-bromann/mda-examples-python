[project]
name = "mda-example-policy-desk-py"
version = "0.0.0"
description = "Policy Desk — authenticated company policy assistant with upload + sandbox Q&A."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "managed-deepagents==0.5.0",
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "ty>=0.0.56",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "PTH",    # flake8-use-pathlib
    "T20",    # flake8-print
    "ASYNC",  # flake8-async
]
ignore = [
    "COM812", # conflicts with the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["middleware", "sandbox"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["./**/*.py"]
exclude = [".venv/**", ".mda/**"]
