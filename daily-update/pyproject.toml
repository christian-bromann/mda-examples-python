[project]
name = "daily-update"
version = "0.0.0"
description = "Weekday GitHub + Slack activity digest → Slack DM + durable memory."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "managed-deepagents",
    "PyGithub>=2.5.0",
    "slack-sdk>=3.33.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "ty>=0.0.56",
]

[tool.uv]
package = false
default-groups = ["dev"]

# Match the TypeScript example: develop against the local Managed Deep Agents
# SDK. CI / clean clones can drop this and use a published wheel instead.
[tool.uv.sources]
managed-deepagents = { path = "../../managed-deepagents-sdk/packages/pypi", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "PTH",    # flake8-use-pathlib
    "T20",    # flake8-print
    "ASYNC",  # flake8-async
]
ignore = [
    "COM812", # conflicts with the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["tools"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["./**/*.py"]
exclude = [".venv/**", ".mda/**"]
