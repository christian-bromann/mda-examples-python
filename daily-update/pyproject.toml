[project]
name = "daily-update"
version = "0.0.0"
description = "Weekday GitHub + Slack activity digest → Slack DM + durable memory."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "managed-deepagents",
    "PyGithub>=2.5.0",
    "slack-sdk>=3.33.0",
]

[tool.uv]
package = false

# Match the TypeScript example: develop against the local Managed Deep Agents
# SDK. CI / clean clones can drop this and use a published wheel instead.
[tool.uv.sources]
managed-deepagents = { path = "../../managed-deepagents-sdk/packages/pypi", editable = true }
